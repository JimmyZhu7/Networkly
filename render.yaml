      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: GCAL_LIVE_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: GCAL_LIVE_ENABLED
      - key: GMAIL_LIVE_CLIENT_ID
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_ID
      - key: GMAIL_LIVE_CLIENT_SECRET
        fromService:
          type: web
