# Render Blueprint for Coverage. `render.com` → New → Blueprint → point at this
# repo. Review plans/hostnames in the dashboard after the first apply; the
# `sync: false` vars must be filled in there (they can't live in git).
#
# Migrations run as `preDeployCommand` on the web service (once per deploy,
# before the new version takes traffic), NOT in the image CMD — so a failed
# migration blocks the release instead of half-applying on every boot.

databases:
  # PLAN NAME VERIFIED, TIER UNCHANGED. `basic-256mb` is still an accepted
  # value: Render's own Blueprint JSON Schema
  # (https://render.com/schema/render.yaml.json, `postgresPlan`) lists it
  # alongside the newer CPU-and-RAM slugs (`0.1c-256mb`, `0.5c-1g`, ...), so
  # the two naming families coexist and nothing here needs renaming. Checked
  # because prose documentation pages now show only the new family, which
  # reads like a deprecation and is not one.
  #
  # `postgresMajorVersion` IS DELIBERATELY ABSENT, and must stay absent until
  # somebody reads the real number off the dashboard. The key is IMMUTABLE
  # after the database is created; omitted, Render uses its current default
  # for a NEW database and leaves an existing one alone. `coverage-db` was
  # created months ago, so its actual major version is not knowable from this
  # repository — and a guessed pin that disagrees with the live database is
  # the one edit here that could turn an apply into a data event. Read
  # "PostgreSQL version" on the coverage-db page in the Render dashboard, and
  # only then decide whether pinning it is worth doing at all.
  #
  # That number is also what the backup cron below depends on: `pg_dump` must
  # be at least the server's major version, and the image now installs the
  # 18 client (see Dockerfile). A server on 17 or below is fine — a newer
  # client dumps an older server. A server on 19, whenever that exists, is
  # not, and the Dockerfile would need to move with it.
  - name: coverage-db
    databaseName: coverage
    user: coverage
    plan: basic-256mb # adjust; Render's smallest paid Postgres. Free tier expires.

services:
  # ---- Web service -------------------------------------------------------
  - type: web
    name: coverage-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: "uv run --package coverage-web python coverage_web/manage.py migrate --noinput"
    envVars:
      # QUOTED, and that is not style. Render's Blueprint schema
      # (https://render.com/schema/render.yaml.json, `envVarFromKeyValue`)
      # types an env var's `value` as string-or-number and nothing else, so
      # a bare `true` — which YAML parses as a BOOLEAN, not the text "true" —
      # is an invalid Blueprint. This is the one key that decides whether the
      # invited beta's admission gate is on at all (accounts/access.py's
      # `beta_enabled`), which makes it the worst possible place to find out
      # how a provider coerces a type it did not ask for. `env.bool` reads
      # "true" exactly as it would read `true`, so quoting costs nothing.
      - key: BETA_ENABLED
        value: "true"
      - key: BETA_MAX_USERS
        value: 100
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates + stores it
      # All three of these are OPTIONAL now, and were not. Render injects
      # RENDER_EXTERNAL_HOSTNAME into every service it runs, and
      # settings/production.py falls back to it for the host, the CSRF origin
      # and SITE_URL — so a first Blueprint apply boots, passes its health
      # check and mails working links with none of them filled in. Set them
      # the moment you attach a custom domain (an explicit value always wins,
      # and both list vars are comma-separated).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. coverage-web.onrender.com,coverage.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://coverage-web.onrender.com
      # The scheme+host used for links built outside a request (the weekly
      # digest's, the trial-ended email's). Was missing from this file
      # entirely, so every digest link on a real deploy pointed at
      # http://localhost:8000 — base.py's dev default. Now only needed for a
      # custom domain; blank resolves to the Render hostname.
      - key: SITE_URL
        sync: false # e.g. https://coverage.app
      # Approved Upstash free shared cache. Preserve its existing TLS
      # rediss:// URL in Render; do not provision a second cache on deploy.
      - key: REDIS_URL
        sync: false
      # Private avatar storage. Set all five values together in Render.
      - key: MEDIA_S3_BUCKET_NAME
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_REGION_NAME
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Optional sign-in providers. Leave blank and their buttons render as
      # "Setup Needed"; fill in and they go live — no code change either way.
      - key: APPLE_OAUTH_CLIENT_ID
        sync: false
      - key: APPLE_OAUTH_KEY_ID
        sync: false
      - key: APPLE_OAUTH_TEAM_ID
        sync: false
      - key: APPLE_OAUTH_PRIVATE_KEY
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_ID
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_SECRET
        sync: false
      # Outbound email (password resets; later digests/alerts). e.g.
      # smtp+tls://resend:API_KEY@smtp.resend.com:587 — blank logs mail to the
      # service logs instead of sending (never 500s).
      # Reserved credential only; the app does not read RESEND_API_KEY.
      # EMAIL_URL controls delivery. Keep it unset until the sender is verified.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. Coverage <no-reply@yourdomain.app>
      - key: SENTRY_DSN
        sync: false # optional; leave blank to disable
      - key: ANTHROPIC_API_KEY
        sync: false # optional; leave blank to disable AI extraction/briefs — costs per call once set
      # Web Push deadline alerts (accounts.push). Blank = the Settings toggle
      # renders as unavailable and the coverage-push-alerts cron below
      # no-ops — no third-party service, generate with
      # `manage.py generate_vapid_keys` (see .env.example).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      # Gmail Live (docs/gmail-live-setup.md) — blank = the Settings page
      # shows nothing new and gmail_watch_renew/gmail_poll/
      # gmail_pubsub_listen all no-op. A SEPARATE OAuth client from
      # GOOGLE_OAUTH_CLIENT_ID above — see that key's comment; do not reuse
      # the login client here. GMAIL_LIVE_PUBSUB_SUBSCRIPTION is the one
      # value only the (currently unused) push listener reads.
      - key: GMAIL_LIVE_CLIENT_ID
        sync: false
      - key: GMAIL_LIVE_CLIENT_SECRET
        sync: false
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        sync: false
      - key: GCAL_LIVE_ENABLED
        sync: false # enable only after testing the separate Calendar consent flow
      # ---- Stripe (billing/stripe_gateway.py) ----------------------------
      # Pay-as-you-go credit top-ups. Both blank = `is_configured()` is False,
      # the Settings card says top-ups aren't on yet, and the webhook 400s
      # cleanly — the same dark-by-default posture as GMAIL_LIVE_* above.
      # Declared here even while blank so they survive a Blueprint re-apply
      # (a key typed into the dashboard but absent from this file is a key
      # the next apply can drop) and so the deploy checklist has one place
      # to look. Use a RESTRICTED key (`rk_`) with Checkout Sessions write
      # and nothing else, never the account secret key. Register the webhook
      # for checkout.session.completed AND async_payment_succeeded — see the
      # handler's docstring on why the second one matters.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---- Gmail Live sync worker (long-running, not a cron) ----------------
  # Syncs every connected mailbox on a timer. A worker, not a cron job,
  # because a cron would pay a container cold start for a job that is
  # usually one HTTP call, and could not tick faster than a minute anyway.
  #
  # POLLING, NOT PUSH — DELIBERATE, AND THE ONE THING THAT WORKS HERE.
  # `gmail_pubsub_listen` is strictly better on latency (a second or two
  # against up to one --interval) and was what this service ran. It cannot
  # run here: pulling from Pub/Sub needs Application Default Credentials,
  # and this service has no way to get them.
  #
  #   - Render is not GCP, so there is no metadata server to mint ADC from
  #     and no workload-identity provider to federate with. Note this
  #     service block never had a GOOGLE_APPLICATION_CREDENTIALS key or a
  #     mounted key file — the listener would have exited on
  #     DefaultCredentialsError on its first boot here, exactly as it does
  #     locally.
  #   - The only remaining option is a service-account JSON key, which the
  #     Google Workspace tenant this project's OAuth client lives in refuses
  #     to issue (org policy iam.disableServiceAccountKeyCreation).
  #
  # `gmail_poll` needs neither: it reads Gmail with the same per-user OAuth
  # refresh token the connect flow already stored, and ends in the same
  # `gmail_live.sync_connection()` the listener did. See that command's
  # docstring and docs/gmail-live-setup.md §5.
  #
  # TO SWITCH BACK TO PUSH once ADC is available on this host, restore:
  #   dockerCommand: "... manage.py gmail_pubsub_listen"
  # and add a credential (GOOGLE_APPLICATION_CREDENTIALS pointing at a
  # mounted key, or a workload-identity config). Nothing else changes —
  # GMAIL_LIVE_PUBSUB_SUBSCRIPTION below is already set for it, and is
  # simply unread while this runs the poller.
  - type: worker
    name: coverage-gmail-live
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # --interval 120: see DEFAULT_INTERVAL in gmail_poll.py for why two
    # minutes rather than as fast as the quota allows.
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_poll --interval 120"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_GMAIL_POLL
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost # no HTTP served here; any value satisfies settings import
      # The same cache the web service uses. A worker serves no HTTP and so
      # counts no login attempts, but `capture.locks` and anything else that
      # reaches for `django.core.cache` must see the SAME store the web
      # service does, or a value written on one side is invisible on the
      # other — and a per-process LocMemCache in an always-on worker is a
      # cache that only ever grows. django-axes reads this same setting.
      - key: REDIS_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: REDIS_URL
      # Share the configured OAuth client and token encryption key with web.
      # Pub/Sub remains optional: polling needs no topic or subscription.
      - key: GMAIL_LIVE_CLIENT_ID
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_ID
      - key: GMAIL_LIVE_CLIENT_SECRET
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_SECRET
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_TOKEN_KEY

  # ---- Freshness pass every 6 hours (scrape + reclassify + reverify) -----
  # Four passes a day keeps deadlines honest across US and Asia hours.
  # The refresh command exits non-zero on stage failures OR when a pass
  # leaves zero open roles, so Render's cron-failure notification doubles
  # as the stale-data alarm.
  - type: cron
    name: coverage-scrape
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */6 * * *" # 00:00 / 06:00 / 12:00 / 18:00 UTC
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py refresh"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_SCRAPE
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      # Share the web service's generated secrets so settings import cleanly.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost # cron serves no HTTP; any value satisfies the settings import

  # ---- Deadline push alerts, once a day (T-7 and T-2 both, in one run) --
  # accounts.push.is_configured() no-ops until VAPID_PUBLIC_KEY/
  # VAPID_PRIVATE_KEY are set below, so this is safe to deploy before those
  # exist — see .env.example for how to generate them
  # (`manage.py generate_vapid_keys`). A fixed UTC hour is fine even though
  # students span US/HK: the command computes each user's own "today" from
  # their stored timezone before deciding what's due (see the command's
  # docstring), so the wall-clock run time only shifts WHEN in their day the
  # notification lands, never WHICH day.
  - type: cron
    name: coverage-push-alerts
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *" # 13:00 UTC = 9am US Eastern / 9pm Hong Kong
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py send_deadline_push_alerts"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_PUSH_ALERTS
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: VAPID_PUBLIC_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: VAPID_PUBLIC_KEY
      - key: VAPID_PRIVATE_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_CLAIM_EMAIL
        fromService:
          type: web
          name: coverage-web
          envVarKey: VAPID_CLAIM_EMAIL

  # ---- Weekly retention digest, a seventh of the roster a day -----------
  # send_weekly_digest is safe to run with zero paid setup: unset EMAIL_URL
  # (production.py's env.email_url default) prints the digest to this cron's
  # own logs instead of actually sending, so nothing bounces and nothing
  # costs money before a real SMTP relay is bought — see the command's
  # docstring. Same fixed-UTC-hour reasoning as push alerts above: each
  # recipient's own "this week" is computed from their stored timezone, so
  # the wall-clock run time only shifts when in their day it lands, not
  # which week.
  #
  # DAILY, NOT MONDAY, AND THAT IS A CAPACITY FIX, NOT A PRODUCT CHANGE.
  # This ran `0 13 * * 1`, which mailed every eligible account inside one
  # minute. The invited beta is capped at 100 students and the free mail tier
  # this deploy is sized for allows 100 messages a DAY — so one digest run
  # could spend the entire day's allowance on itself and leave nothing for
  # the mail somebody is waiting on: the confirmation, the reset, the
  # invitation. Those would have failed at the provider, after the app had
  # already told the student to check their inbox.
  #
  # `--spread` takes the seventh of the roster whose `pk % 7` matches the
  # run's UTC weekday, so each student still gets exactly one digest every
  # seven days on their own fixed weekday, and no single day carries more
  # than about a seventh of the bill. `DIGEST_DAILY_SEND_CAP` (default 60,
  # settings/base.py) is the hard ceiling on top of that, and it applies
  # whether or not the flag is passed. Nothing about the email's content or
  # cadence changes: "closing this week" is a rolling window from the
  # recipient's own today, not a calendar week, so a Thursday student's
  # digest reads exactly as a Monday student's does.
  - type: cron
    name: coverage-weekly-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *" # 13:00 UTC daily = 9am US Eastern / 9pm Hong Kong
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py send_weekly_digest --spread"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_WEEKLY_DIGEST
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: EMAIL_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: EMAIL_URL
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: coverage-web
          envVarKey: DEFAULT_FROM_EMAIL
      # Cron services have no public hostname. Set SITE_URL explicitly on
      # coverage-web before enabling email; inherit that canonical origin.
      - key: SITE_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: SITE_URL

  # ---- Gmail Live watch renewal, once a day -----------------------------
  # Google's users.watch() registration expires after 7 days regardless of
  # activity — this keeps it alive. gmail_live.is_configured() no-ops the
  # whole command until GMAIL_LIVE_* is set, same posture as VAPID above.
  #
  # 05:30, AFTER coverage-pro-trial-expire's 05:00. These two ran in the
  # opposite order (renew 05:00, expire 05:30) and the ordering was
  # backwards: this command renews the watch of every `plan="pro"`
  # connection, so a trial that ended overnight got one last 7-day renewal
  # half an hour before the flip that was meant to stop it. Harmless in
  # practice today (nothing pulls the subscription), but the job that
  # DECIDES who is Pro has to land before the job that ACTS on who is Pro,
  # and half an hour of slack is enough for a slow expire pass.
  - type: cron
    name: coverage-gmail-watch-renew
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "30 5 * * *" # 05:30 UTC — after trial-expire, clear of the scrape's 00/06/12/18 marks
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_watch_renew"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_GMAIL_WATCH_RENEW
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # Share Gmail credentials; optional Pub/Sub stays explicitly configured.
      - key: GMAIL_LIVE_CLIENT_ID
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_ID
      - key: GMAIL_LIVE_CLIENT_SECRET
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_SECRET
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_TOKEN_KEY

  # ---- Off-host database snapshot, once a day ---------------------------
  #
  # DEFINE NOW, RESUME ONLY AFTER PAYMENT. This service exists in the
  # Blueprint so the backup is part of the deploy's definition rather than a
  # thing somebody means to set up later; it is NOT part of the launch.
  # After the first apply, SUSPEND coverage-db-backup in the Render dashboard
  # along with the rest, and leave it suspended until object storage for it
  # has been bought. Render's Blueprint schema has no `suspended:` key — a
  # cron cannot be declared dormant in this file (checked against
  # https://render.com/schema/render.yaml.json, `cronService`) — so there are
  # two locks instead, and the second one is in the code:
  #
  #   1. The service is suspended in the dashboard.
  #   2. `--require-s3` with a blank BACKUP_S3_BUCKET makes the command a
  #      complete no-op: no pg_dump, no connection to the database, no file.
  #      It prints why and exits 0. So even a service resumed by accident
  #      does nothing until a bucket is named, and a red cron every night
  #      does not train the one person watching to ignore red crons.
  #
  # 04:15 UTC, ahead of the 05:00/05:30 block and well clear of the scrape's
  # 00/06/12/18 marks: a snapshot should be the last quiet thing before the
  # day's plan flips, not concurrent with them.
  #
  # WHY THIS CAN RUN HERE AT ALL. It could not before: the image had no
  # Postgres client, so `backup_db` (which shells out to pg_dump) could only
  # run from a laptop. The Dockerfile now installs the PGDG
  # postgresql-client-18 — see its comment, and see the coverage-db block
  # above for why 18 specifically.
  #
  # A SEPARATE BUCKET FROM THE AVATARS, sharing only the endpoint and the
  # credentials. One object here is every row in the app; it does not belong
  # in the same listing as media a request path can reach. `--keep 14` holds
  # the same fourteen-snapshot ring in the bucket that the local command
  # holds on disk. NOT wired to /ops/health/cron/ (ops.tracking) on purpose,
  # because a tracked job that is deliberately never run reads as a dead job
  # forever; add it there in the same change that resumes the service.
  - type: cron
    name: coverage-db-backup
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "15 4 * * *" # 04:15 UTC, before the 05:00 daily block
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py backup_db --require-s3 --dest /tmp/coverage-backup --keep 14"
    envVars:
      # The off switch. Blank (the default) = this cron does nothing at all.
      # Name a bucket ONLY when its storage is paid for and the service is
      # meant to be live.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false # optional; defaults to "db/"
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # The endpoint and credentials, not the bucket: core.storage resolves
      # these into settings.STORAGES["default"], which is where backup_db
      # reads them from. All four or none — a partial set fails at boot.
      - key: MEDIA_S3_BUCKET_NAME
        fromService:
          type: web
          name: coverage-web
          envVarKey: MEDIA_S3_BUCKET_NAME
      - key: MEDIA_S3_ENDPOINT_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: MEDIA_S3_ENDPOINT_URL
      - key: MEDIA_S3_REGION_NAME
        fromService:
          type: web
          name: coverage-web
          envVarKey: MEDIA_S3_REGION_NAME
      - key: MEDIA_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: coverage-web
          envVarKey: MEDIA_S3_ACCESS_KEY_ID
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: MEDIA_S3_SECRET_ACCESS_KEY
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED

  # ---- Pro trial expiry, once a day --------------------------------------
  # accounts.trials starts a PRO_TRIAL_DAYS-long trial the moment a Free
  # student connects Gmail (PRO_TRIAL_TRIGGER default "gmail_connect"); this
  # is the other half — reverts `plan` back to "free" once
  # `pro_trial_ends_at` passes. Does not touch Gmail at all: the trial's
  # real-time sync stops on its own the next time coverage-gmail-watch-renew
  # runs (its own `user.plan == "pro"` gate simply stops picking the
  # connection up), so this only ever needs to run once a day, same cadence
  # as that job. A fixed UTC hour is fine — this flips a plan, not a
  # per-student "today," so there is no timezone-correctness reason (unlike
  # the push-alerts/digest crons below) to anchor it to each student's own day.
  #
  # 05:00, THIRTY MINUTES BEFORE coverage-gmail-watch-renew — see that
  # service's own comment for why the previous order was backwards. This job
  # also sends the trial-ended email (blank EMAIL_URL = the Settings banner
  # alone, no send) and unlocks the student's Free "Scan Now"; see the
  # command's docstring.
  - type: cron
    name: coverage-pro-trial-expire
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 5 * * *" # 05:00 UTC — before gmail-watch-renew, clear of the scrape's 00/06/12/18 marks
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py pro_trial_expire"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_PRO_TRIAL_EXPIRE
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # The trial-ended email. Blank = no send at all (not a send to the
      # logs): accounts.trials.email_is_configured() reads False on the
      # console backend, and the Settings banner carries the whole notice
      # instead. Inherit web settings once its sender is verified.
      - key: EMAIL_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: EMAIL_URL
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: coverage-web
          envVarKey: DEFAULT_FROM_EMAIL
      # Cron services have no public hostname; inherit the web service's
      # explicitly configured origin for the "Open Settings" link.
      - key: SITE_URL
        fromService:
          type: web
          name: coverage-web
          envVarKey: SITE_URL

  # ---- Gmail Live first-connect backfill + "Scan Now" rescans, every ----
  # ---- 5 minutes ----------------------------------------------------------
  # A tight tick because a newly-connected user (or someone who just hit
  # "Scan Now" in Settings) should not sit at "queued" for hours, but each
  # run costs almost nothing when idle — the very first things it does are
  # `SELECT ... WHERE backfill_status IN (pending, failed)` and the same
  # for `rescan_status`, and at this app's scale both are empty on nearly
  # every run. See capture/management/commands/gmail_backfill.py for what
  # actually happens on the rare run that finds something in either queue.
  #
  # FIVE MINUTES, NOT FIFTEEN, and for the reason coverage-autopilot below
  # already gives for its own tick: a student is WATCHING this one. They
  # pressed a button, the row says "Queued — starts shortly", and fifteen
  # minutes is not shortly. The two jobs are the same shape (a POST that
  # queues, a tick that claims) and had no business being on different
  # clocks — the fifteen was chosen when this queue only ever held one
  # person, who was the developer.
  #
  # Safe to shorten because the command bounds its own work: TICK_BUDGET
  # (300s) stops it starting new connections past the interval, so ticks
  # cannot pile up on each other no matter how many users are queued, and
  # the per-mailbox advisory lock means an overlap would be declined rather
  # than duplicated anyway.
  - type: cron
    name: coverage-gmail-backfill
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_backfill"
    envVars:
      # Optional success heartbeat; configure a missed-run alert separately.
      - key: HEALTHCHECK_URL_GMAIL_BACKFILL
        sync: false
      - key: BETA_ENABLED
        fromService:
          type: web
          name: coverage-web
          envVarKey: BETA_ENABLED
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: SENTRY_DSN
        fromService:
          type: web
          name: coverage-web
          envVarKey: SENTRY_DSN
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # Ambiguous rescan threads use AI after deterministic extraction.
      # Without the worker's own key that stage silently stays disabled.
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: ANTHROPIC_API_KEY
      # Share Gmail credentials; optional Pub/Sub stays explicitly configured.
      - key: GMAIL_LIVE_CLIENT_ID
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_ID
      - key: GMAIL_LIVE_CLIENT_SECRET
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_CLIENT_SECRET
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: GMAIL_LIVE_TOKEN_KEY

  # Read-only Google Calendar mirroring. The explicit flag keeps it idle
  # until the founder enables Calendar after its separate consent test.
  - type: cron
    name: coverage-gcal-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "4-59/5 * * * *"
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gcal_sync --apply"
    envVars:
